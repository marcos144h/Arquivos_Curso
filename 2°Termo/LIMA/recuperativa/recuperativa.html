<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>TECHFEST</title>
</head>
<body>
    <header>
        <a href="#inicio" class="logo"><span>TECH</span>FEST</a>
        <nav>
            <a href="#inicio">INÍCIO</a>
            <a href="#atracoes">ATRAÇÕES</a>
            <a href="#programacao">PROGRAMAÇÃO</a>
            <a href="#sobre">SOBRE</a>
        </nav>
    </header>

    <main>
        <section id="inicio" class="destaque">
            <div class="texto-destaque">
                <h2>TECNOLOGIA QUE TRANSFORMA</h2>
                <p>Descrição de destaque do festival</p>
                <a href="#atracoes" class="botao">Explorar atrações</a>
            </div>
            <img src="https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=600&q=80" alt="Tecnologia em destaque">
        </section>

        <section id="atracoes" class="galeria">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1677442136019-21780ecad995?auto=format&fit=crop&w=500&q=80" alt="Inteligência Artificial">
                <p>Inteligência Artificial</p>
            </div>
            <div class="card">
                <img src="https://images.unsplash.com/photo-1485827404703-89b55fcc595e?auto=format&fit=crop&w=500&q=80" alt="Robótica Avançada">
                <p>Robótica Avançada</p>
            </div>
            <div class="card">
                <img src="https://images.unsplash.com/photo-1622979135225-d2ba269cf1ac?auto=format&fit=crop&w=500&q=80" alt="Realidade Virtual">
                <p>Realidade Virtual</p>
            </div>
            <div class="card">
                <img src="https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&w=500&q=80" alt="Cibersegurança">
                <p>Cibersegurança</p>
            </div>
            <div class="card">
                <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=500&q=80" alt="Games e eSports">
                <p>Games e eSports</p>
            </div>
            <div class="card">
                <img src="https://images.unsplash.com/photo-1519389950473-47ba0277781c?auto=format&fit=crop&w=500&q=80" alt="Inovação e Startups">
                <p>Inovação e Startups</p>
            </div>
        </section>
    </main>

    <footer>
        <a href="#inicio">Rodapé</a>
        <a href="#contato">Contato</a>
        <a href="#creditos">Créditos</a>
    </footer>
</body>
</html>
