    <title>Simple AI Application</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

        <h1>Welcome to the Simple AI Application</h1>

    </main>
    <footer>

    </footer>
    <script src="js/app.js"></script>
